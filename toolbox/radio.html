<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RTHK Radio 2 - 3D Retro Receiver</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at 50% 40%, #3e4348 0%, #202326 70%, #141618 100%);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Top Hint */
        .hint-text {
            position: absolute;
            top: max(16px, env(safe-area-inset-top));
            left: 50%;
            transform: translateX(-50%);
            color: rgba(230, 200, 140, 0.7);
            font-size: clamp(10px, 2.5vw, 12px);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
            pointer-events: none;
            z-index: 5;
            text-align: center;
            white-space: nowrap;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }

        /* 復古黃銅底座定時按鈕 (Vintage Floating Capsule) */
        .timer-capsule-btn {
            position: absolute;
            bottom: max(24px, env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: linear-gradient(180deg, #2c251d 0%, #1a1612 100%);
            border: 1.5px solid #d4af37;
            border-radius: 30px;
            padding: 10px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0,0,0,0.7), inset 0 1px 1px rgba(255,220,130,0.3);
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .timer-capsule-btn:active {
            transform: translateX(-50%) scale(0.95);
        }

        .capsule-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
        }

        .capsule-icon svg {
            width: 100%;
            height: 100%;
            stroke: #d4af37;
            filter: drop-shadow(0 0 2px rgba(212, 175, 55, 0.5));
        }

        .capsule-label {
            color: #ecd078;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            font-family: 'Courier New', Courier, monospace;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }

        .capsule-led {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #443322;
            transition: background 0.3s, box-shadow 0.3s;
        }

        .capsule-led.active {
            background: #ffaa00;
            box-shadow: 0 0 8px #ffaa00, 0 0 14px rgba(255, 170, 0, 0.8);
        }

        /* 復古簡約定時視窗 Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: linear-gradient(165deg, #24201c 0%, #151311 100%);
            border: 2px solid #b8860b;
            border-radius: 18px;
            width: 90%;
            max-width: 360px;
            padding: 24px 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 1px 1px rgba(255,255,255,0.15);
            color: #d8c39e;
            transform: scale(0.92);
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal-overlay.open .modal-card {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            padding-bottom: 10px;
        }

        .modal-title {
            font-size: 14px;
            font-weight: 800;
            color: #ecd078;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .modal-close-x {
            background: transparent;
            border: none;
            color: #887a66;
            font-size: 20px;
            line-height: 1;
            cursor: pointer;
            padding: 4px;
        }

        /* 快速預設網格 */
        .preset-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 22px;
        }

        .preset-btn {
            background: #1b1916;
            border: 1px solid #4a3e2b;
            color: #c9b085;
            padding: 10px 0;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            transition: all 0.15s;
        }

        .preset-btn:active {
            transform: scale(0.96);
        }

        .preset-btn.active {
            background: linear-gradient(180deg, #b8860b 0%, #8b6508 100%);
            color: #120e06;
            border-color: #ffd700;
            box-shadow: 0 0 10px rgba(218, 165, 32, 0.4);
        }

        /* 自定義步進器 */
        .custom-stepper-wrap {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #12100d;
            border: 1px solid #3d3323;
            border-radius: 10px;
            padding: 6px;
            margin-bottom: 24px;
        }

        .step-btn {
            background: #2a241d;
            border: 1px solid #5a4930;
            color: #ffd685;
            width: 44px;
            height: 44px;
            border-radius: 8px;
            font-size: 22px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
        }

        .step-btn:active {
            background: #3e3427;
        }

        .stepper-display {
            display: flex;
            align-items: baseline;
            gap: 4px;
        }

        .stepper-input {
            width: 70px;
            background: transparent;
            border: none;
            color: #ffde94;
            font-family: 'Courier New', Courier, monospace;
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            outline: none;
        }

        .stepper-input::-webkit-outer-spin-button,
        .stepper-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .stepper-unit {
            color: #8c7c64;
            font-size: 13px;
            font-weight: bold;
        }

        /* 底部操作欄 */
        .modal-actions {
            display: flex;
            gap: 12px;
        }

        .action-btn {
            flex: 1;
            padding: 13px 0;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.15s;
        }

        .action-btn:active {
            transform: scale(0.97);
        }

        .btn-infinite {
            background: #24201c;
            color: #a89474;
            border-color: #4a3e2c;
        }

        .btn-confirm {
            background: linear-gradient(180deg, #d4af37 0%, #aa8524 100%);
            color: #1a1405;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }
    </style>
</head>
<body>

    <div class="hint-text">DRAG TO ROTATE &bull; TAP KNOB OR BODY TO POWER</div>
    <div id="canvas-container"></div>

    <!-- 復古高級時間膠囊按鍵 (極簡黃銅 SVG 圖標) -->
    <div class="timer-capsule-btn" id="capsule-btn">
        <span class="capsule-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="13" r="8"></circle>
                <line x1="12" y1="9" x2="12" y2="13"></line>
                <line x1="12" y1="13" x2="14.5" y2="14.5"></line>
                <path d="M10 2h4"></path>
                <line x1="12" y1="2" x2="12" y2="5"></line>
            </svg>
        </span>
        <span class="capsule-label" id="capsule-label">SLEEP: OFF (∞)</span>
        <div class="capsule-led" id="capsule-led"></div>
    </div>

    <!-- 極簡定時設定彈窗 -->
    <div class="modal-overlay" id="timer-modal">
        <div class="modal-card">
            <div class="modal-header">
                <span class="modal-title">SLEEP TIMER / 定時關機</span>
                <button class="modal-close-x" id="modal-close-x">&times;</button>
            </div>

            <!-- 快捷預設 -->
            <div class="preset-grid">
                <button class="preset-btn" data-mins="15">15 MIN</button>
                <button class="preset-btn" data-mins="30">30 MIN</button>
                <button class="preset-btn" data-mins="45">45 MIN</button>
                <button class="preset-btn" data-mins="60">60 MIN</button>
                <button class="preset-btn" data-mins="90">90 MIN</button>
                <button class="preset-btn" data-mins="120">120 MIN</button>
            </div>

            <!-- 大按鈕微調步進器 -->
            <div class="custom-stepper-wrap">
                <button class="step-btn" id="step-minus">&minus;</button>
                <div class="stepper-display">
                    <input type="number" id="modal-minutes" class="stepper-input" value="30" min="1" max="999">
                    <span class="stepper-unit">MIN</span>
                </div>
                <button class="step-btn" id="step-plus">&plus;</button>
            </div>

            <!-- 操作鍵 -->
            <div class="modal-actions">
                <button class="action-btn btn-infinite" id="btn-cancel-timer">無限播放 (OFF)</button>
                <button class="action-btn btn-confirm" id="btn-start-timer">設定定時</button>
            </div>
        </div>
    </div>

    <!-- 主收音機音頻與後台防休眠音頻 -->
    <audio id="radio-audio" preload="none" playsinline webkit-playsinline></audio>
    <audio id="silence-audio" loop preload="none" playsinline webkit-playsinline></audio>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // --- 核心音訊流 ---
        const hqStreamUrl = 'https://rthkaudio2-lh.akamaihd.net/i/radio2_1@355865/master.m3u8';
        const sdStreamUrl = 'https://stm.rthk.hk/radio2';
        
        const audio = document.getElementById('radio-audio');
        const silenceAudio = document.getElementById('silence-audio');
        // 極小長度的無聲音訊 Data URI（做為背景防休眠錨點）
        silenceAudio.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';

        const capsuleBtn = document.getElementById('capsule-btn');
        const capsuleLabel = document.getElementById('capsule-label');
        const capsuleLed = document.getElementById('capsule-led');

        const timerModal = document.getElementById('timer-modal');
        const modalCloseX = document.getElementById('modal-close-x');
        const modalMinutes = document.getElementById('modal-minutes');
        const stepMinus = document.getElementById('step-minus');
        const stepPlus = document.getElementById('step-plus');
        const presetBtns = document.querySelectorAll('.preset-btn');
        const btnCancelTimer = document.getElementById('btn-cancel-timer');
        const btnStartTimer = document.getElementById('btn-start-timer');

        let isPlaying = false;
        let isUserPaused = false; // 修訂關鍵：區分用戶在通知欄主動暫停與系統異常中斷
        let isShuttingDown = false;
        let hls = null;
        let targetSleepTime = null; // null 即代表無限制無限播放
        let lastUiUpdateTime = 0;
        let reconnectTimeout = null;

        // 健康狀態與背景續播變數
        let lastAudioCurrentTime = -1;
        let lastTimeProgressStamp = Date.now();

        // 螢幕與渲染狀態
        let isPageVisible = !document.hidden;

        // 顯示字串
        let statusString = "RTHK 2 [OFF]";
        let timerString = "SLEEP: OFF";

        // 判斷是否為 iOS / iPadOS 環境 (原生 HLS 背景存活率極高)
        const isAppleDevice = /iPad|iPhone|iPod/.test(navigator.userAgent) || 
                              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

        // --- 全域影片靜音搶佔防禦 (點擊其他影片時，收音機繼續播，影片靜音) ---
        function suppressOtherMedia(mediaEl) {
            if (!mediaEl || mediaEl === audio || mediaEl === silenceAudio) return;
            mediaEl.muted = true;
            mediaEl.volume = 0;
            mediaEl.setAttribute('muted', '');
        }

        // 捕捉式監聽所有 play 事件
        document.addEventListener('play', (e) => {
            const el = e.target;
            if (el && (el.tagName === 'VIDEO' || el.tagName === 'AUDIO') && el !== audio && el !== silenceAudio) {
                suppressOtherMedia(el);
                // 確保若收音機正在工作且非用戶暫停，立刻拉起收音機
                if (isPlaying && !isUserPaused && audio.paused) {
                    audio.play().catch(() => {});
                }
            }
        }, true);

        // 防止影片中途被取消靜音
        document.addEventListener('volumechange', (e) => {
            const el = e.target;
            if (el && (el.tagName === 'VIDEO' || el.tagName === 'AUDIO') && el !== audio && el !== silenceAudio) {
                if (!el.muted || el.volume > 0) {
                    suppressOtherMedia(el);
                }
            }
        }, true);

        // 監視動態插入的 video 標籤
        const mediaObserver = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
                mutation.addedNodes.forEach((node) => {
                    if (node.tagName === 'VIDEO' || node.tagName === 'AUDIO') {
                        suppressOtherMedia(node);
                    } else if (node.querySelectorAll) {
                        node.querySelectorAll('video, audio').forEach(suppressOtherMedia);
                    }
                });
            });
        });
        mediaObserver.observe(document.documentElement, { childList: true, subtree: true });

        // --- Three.js 視圖初始化 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.15;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 + 0.05;
        controls.minDistance = 3.0;
        controls.maxDistance = 25.0;

        function updateResponsiveCamera() {
            const aspect = window.innerWidth / window.innerHeight;
            camera.aspect = aspect;
            
            let targetDistance;
            if (aspect < 1.0) {
                targetDistance = Math.max(6.5, 5.8 / aspect);
            } else {
                targetDistance = 6.6;
            }
            
            camera.position.set(0, targetDistance * 0.12, targetDistance);
            camera.lookAt(0, 0, 0);
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        updateResponsiveCamera();
        window.addEventListener('resize', updateResponsiveCamera);

        // --- 燈光配置 ---
        const ambientLight = new THREE.AmbientLight(0xfff5ea, 1.4);
        scene.add(ambientLight);

        const keyLight = new THREE.DirectionalLight(0xffffff, 1.8);
        keyLight.position.set(5, 8, 6);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.width = 2048;
        keyLight.shadow.mapSize.height = 2048;
        keyLight.shadow.bias = -0.0001;
        scene.add(keyLight);

        const fillLight = new THREE.DirectionalLight(0xddeeff, 1.0);
        fillLight.position.set(-6, 3, 4);
        scene.add(fillLight);

        const rimLight = new THREE.DirectionalLight(0xffd188, 2.2);
        rimLight.position.set(0, 5, -5);
        scene.add(rimLight);

        const ledPointLight = new THREE.PointLight(0xff2222, 0, 2.0);
        ledPointLight.position.set(1.4, 0.7, 1.15);
        scene.add(ledPointLight);

        // 陰影地面
        const shadowPlaneGeo = new THREE.PlaneGeometry(30, 30);
        const shadowPlaneMat = new THREE.ShadowMaterial({ opacity: 0.25 });
        const shadowPlane = new THREE.Mesh(shadowPlaneGeo, shadowPlaneMat);
        shadowPlane.rotation.x = -Math.PI / 2;
        shadowPlane.position.y = -1.35;
        shadowPlane.receiveShadow = true;
        scene.add(shadowPlane);

        // --- 程序紋理生成 ---
        function createWoodTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            
            const grad = ctx.createLinearGradient(0, 0, 1024, 0);
            grad.addColorStop(0, '#80451e');
            grad.addColorStop(0.5, '#995426');
            grad.addColorStop(1, '#7a3e18');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 1024, 1024);

            for (let i = 0; i < 1200; i++) {
                ctx.fillStyle = `rgba(${160 + Math.random()*60}, ${90 + Math.random()*40}, 30, ${0.04 + Math.random()*0.06})`;
                const y = Math.random() * 1024;
                const h = 1 + Math.random() * 3;
                ctx.fillRect(0, y, 1024, h);
            }
            return new THREE.CanvasTexture(canvas);
        }

        function createGrillTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#22201d';
            ctx.fillRect(0, 0, 256, 256);
            
            ctx.fillStyle = '#c8a664';
            for (let x = 4; x < 256; x += 8) {
                for (let y = 4; y < 256; y += 8) {
                    ctx.fillRect(x, y, 3, 3);
                }
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(4, 2);
            return texture;
        }

        function createBrandPlateTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 128;
            const ctx = canvas.getContext('2d');

            const grad = ctx.createLinearGradient(0, 0, 0, 128);
            grad.addColorStop(0, '#f3d677');
            grad.addColorStop(0.5, '#d4af37');
            grad.addColorStop(1, '#a67c1e');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 512, 128);

            ctx.lineWidth = 6;
            ctx.strokeStyle = '#6e4f0d';
            ctx.strokeRect(6, 6, 500, 116);

            ctx.font = '900 48px Arial, sans-serif';
            ctx.fillStyle = '#2e2008';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.letterSpacing = '3px';
            ctx.fillText('RTHK RADIO 2', 256, 66);

            return new THREE.CanvasTexture(canvas);
        }

        const lcdCanvas = document.createElement('canvas');
        lcdCanvas.width = 512; lcdCanvas.height = 256;
        const lcdCtx = lcdCanvas.getContext('2d');
        const lcdTexture = new THREE.CanvasTexture(lcdCanvas);

        function updateLcdTexture(force = false) {
            if (!isPageVisible && !force) return;

            lcdCtx.fillStyle = isPlaying ? '#86c466' : '#454f3d';
            lcdCtx.fillRect(0, 0, 512, 256);
            
            lcdCtx.fillStyle = isPlaying ? 'rgba(0,0,0,0.06)' : 'rgba(0,0,0,0.18)';
            for(let y=0; y<256; y+=4) {
                lcdCtx.fillRect(0, y, 512, 1.5);
            }

            lcdCtx.font = 'bold 44px "Courier New", monospace';
            lcdCtx.fillStyle = isPlaying ? '#102206' : '#232d1d';
            lcdCtx.textAlign = 'center';
            lcdCtx.textBaseline = 'middle';
            
            lcdCtx.fillText(statusString, 256, 95);
            lcdCtx.font = 'bold 36px "Courier New", monospace';
            lcdCtx.fillText(timerString, 256, 165);
            
            lcdTexture.needsUpdate = true;
        }
        updateLcdTexture(true);

        // --- 構建 3D 復古收音機幾何體 ---
        const radioGroup = new THREE.Group();
        scene.add(radioGroup);

        const woodMat = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            map: createWoodTexture(),
            roughness: 0.25,
            metalness: 0.05
        });
        const bodyGeo = new THREE.BoxGeometry(3.6, 2.4, 2.0);
        const radioBody = new THREE.Mesh(bodyGeo, woodMat);
        radioBody.castShadow = true;
        radioBody.receiveShadow = true;
        radioGroup.add(radioBody);

        const brassMat = new THREE.MeshStandardMaterial({
            color: 0xecd078,
            roughness: 0.22,
            metalness: 0.9
        });

        const faceFrameGeo = new THREE.BoxGeometry(3.2, 2.0, 0.05);
        const faceFrameMat = new THREE.MeshStandardMaterial({ color: 0x221a14, roughness: 0.7 });
        const faceFrame = new THREE.Mesh(faceFrameGeo, faceFrameMat);
        faceFrame.position.set(0, 0, 1.01);
        radioGroup.add(faceFrame);

        const plateGeo = new THREE.PlaneGeometry(1.5, 0.35);
        const plateMat = new THREE.MeshStandardMaterial({
            map: createBrandPlateTexture(),
            roughness: 0.3,
            metalness: 0.6
        });
        const plateMesh = new THREE.Mesh(plateGeo, plateMat);
        plateMesh.position.set(0, 0.76, 1.04);
        radioGroup.add(plateMesh);

        const grillGeo = new THREE.BoxGeometry(2.9, 0.75, 0.04);
        const grillMat = new THREE.MeshStandardMaterial({
            map: createGrillTexture(),
            roughness: 0.7,
            metalness: 0.3
        });
        const grillMesh = new THREE.Mesh(grillGeo, grillMat);
        grillMesh.position.set(0, 0.15, 1.04);
        radioGroup.add(grillMesh);

        const lcdFrameGeo = new THREE.BoxGeometry(1.45, 0.75, 0.06);
        const lcdFrameMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.4 });
        const lcdFrame = new THREE.Mesh(lcdFrameGeo, lcdFrameMat);
        lcdFrame.position.set(-0.72, -0.55, 1.04);
        radioGroup.add(lcdFrame);

        const lcdScreenGeo = new THREE.PlaneGeometry(1.35, 0.65);
        const lcdScreenMat = new THREE.MeshBasicMaterial({ map: lcdTexture });
        const lcdScreen = new THREE.Mesh(lcdScreenGeo, lcdScreenMat);
        lcdScreen.position.set(-0.72, -0.55, 1.08);
        radioGroup.add(lcdScreen);

        const ledGeo = new THREE.SphereGeometry(0.06, 16, 16);
        const ledMat = new THREE.MeshStandardMaterial({
            color: 0x330000,
            roughness: 0.2,
            metalness: 0.8,
            emissive: 0x000000
        });
        const ledMesh = new THREE.Mesh(ledGeo, ledMat);
        ledMesh.position.set(1.35, 0.76, 1.04);
        radioGroup.add(ledMesh);

        const knobGroup = new THREE.Group();
        knobGroup.position.set(0.82, -0.55, 1.03);
        
        const knobBaseGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.2, 32);
        knobBaseGeo.rotateX(Math.PI / 2);
        const knobMesh = new THREE.Mesh(knobBaseGeo, brassMat);
        knobMesh.castShadow = true;
        knobGroup.add(knobMesh);

        const notchGeo = new THREE.BoxGeometry(0.05, 0.2, 0.22);
        const notchMat = new THREE.MeshBasicMaterial({ color: 0xd92b2b });
        const notchMesh = new THREE.Mesh(notchGeo, notchMat);
        notchMesh.position.set(0, 0.15, 0);
        knobGroup.add(notchMesh);

        radioGroup.add(knobGroup);

        const antennaGeo = new THREE.CylinderGeometry(0.025, 0.035, 2.2, 16);
        const antennaMesh = new THREE.Mesh(antennaGeo, brassMat);
        antennaMesh.position.set(1.4, 1.9, -0.7);
        antennaMesh.rotation.z = -0.15;
        antennaMesh.castShadow = true;
        radioGroup.add(antennaMesh);

        for(let x of [-1.4, 1.4]) {
            for(let z of [-0.7, 0.7]) {
                const footGeo = new THREE.CylinderGeometry(0.08, 0.06, 0.15, 16);
                const footMesh = new THREE.Mesh(footGeo, brassMat);
                footMesh.position.set(x, -1.25, z);
                footMesh.castShadow = true;
                radioGroup.add(footMesh);
            }
        }

        // --- 點擊本體或旋鈕開關機 ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('pointerdown', (e) => {
            if (e.target.closest('.timer-capsule-btn') || e.target.closest('.modal-overlay')) return;
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            
            const intersects = raycaster.intersectObjects([knobMesh, notchMesh, radioBody], true);
            if (intersects.length > 0) {
                isUserPaused = false;
                if (isPlaying) stopRadio();
                else playRadio();
            }
        });

        let targetKnobAngle = 0;
        function updateKnobAnimation() {
            targetKnobAngle = (isPlaying && !isUserPaused) ? -Math.PI / 2 : 0;
            knobGroup.rotation.z += (targetKnobAngle - knobGroup.rotation.z) * 0.15;
        }

        // --- 背景高精度 Worker 心跳引擎 ---
        let bgWorker = null;
        function initBackgroundWorker() {
            if (bgWorker) return;
            try {
                const blob = new Blob([
                    `let t = null;
                    self.onmessage = function(e) {
                        if (e.data === 'start') {
                            if (!t) t = setInterval(function() { self.postMessage('tick'); }, 1000);
                        } else if (e.data === 'stop') {
                            if (t) { clearInterval(t); t = null; }
                        }
                    };`
                ], { type: 'application/javascript' });
                bgWorker = new Worker(URL.createObjectURL(blob));
                bgWorker.onmessage = function() {
                    checkSleepTimer();
                    // 只有在非用戶手動暫停時，才執行背景防休眠恢復
                    if (isPlaying && !isShuttingDown && !isUserPaused) {
                        if (audio.paused) {
                            triggerAutoResume();
                        } else {
                            checkStreamHealth();
                        }
                    }
                };
                bgWorker.postMessage('start');
            } catch (e) {}
        }
        initBackgroundWorker();

        // --- 定時器與彈窗邏輯 ---
        function openTimerModal() {
            timerModal.classList.add('open');
        }

        function closeTimerModal() {
            timerModal.classList.remove('open');
        }

        capsuleBtn.addEventListener('click', openTimerModal);
        modalCloseX.addEventListener('click', closeTimerModal);
        timerModal.addEventListener('click', (e) => {
            if (e.target === timerModal) closeTimerModal();
        });

        // 步進器增減
        stepMinus.addEventListener('click', () => {
            let val = parseInt(modalMinutes.value) || 30;
            if (val > 1) modalMinutes.value = val - 5 > 1 ? val - 5 : 1;
            clearPresetSelection();
        });

        stepPlus.addEventListener('click', () => {
            let val = parseInt(modalMinutes.value) || 30;
            modalMinutes.value = val + 5;
            clearPresetSelection();
        });

        function clearPresetSelection() {
            presetBtns.forEach(b => b.classList.remove('active'));
        }

        presetBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                clearPresetSelection();
                btn.classList.add('active');
                modalMinutes.value = btn.dataset.mins;
            });
        });

        // 設定定時關閉
        btnStartTimer.addEventListener('click', () => {
            let mins = parseInt(modalMinutes.value);
            if (isNaN(mins) || mins <= 0) mins = 30;
            targetSleepTime = Date.now() + (mins * 60 * 1000);
            localStorage.setItem('rthk_sleep_time', mins);
            updateTimerDisplay(Date.now());
            capsuleLed.classList.add('active');
            preloadTTS();
            closeTimerModal();
        });

        // 取消定時，設定為「無限運作」
        btnCancelTimer.addEventListener('click', () => {
            targetSleepTime = null; // 無限運行，永不自動關機
            timerString = 'SLEEP: OFF';
            capsuleLabel.textContent = 'SLEEP: OFF (∞)';
            capsuleLed.classList.remove('active');
            updateLcdTexture(true);
            closeTimerModal();
        });

        function checkSleepTimer() {
            // 沒有設置時間，代表無限運作，絕對不關閉！
            if (!targetSleepTime) return;

            let now = Date.now();
            if (now >= targetSleepTime) {
                targetSleepTime = null;
                timerString = 'SLEEP: OFF';
                capsuleLabel.textContent = 'SLEEP: OFF (∞)';
                capsuleLed.classList.remove('active');
                updateLcdTexture(true);
                if (isPlaying && !isShuttingDown) playTTSAndStop();
            } else {
                if (now - lastUiUpdateTime >= 1000) {
                    updateTimerDisplay(now);
                    lastUiUpdateTime = now;
                }
            }
        }

        function updateTimerDisplay(now) {
            let remainingSecs = Math.ceil((targetSleepTime - now) / 1000);
            if(remainingSecs < 0) remainingSecs = 0;
            const m = Math.floor(remainingSecs / 60);
            const s = remainingSecs % 60;
            const timeStr = `${m}:${s.toString().padStart(2, '0')}`;
            timerString = `SLEEP: ${timeStr}`;
            capsuleLabel.textContent = `SLEEP: ${timeStr}`;
            updateLcdTexture();
        }

        // --- 粵語 TTS 預載 ---
        function preloadTTS() {
            const ttsText = "夠鐘罅，而家會幫你刪機。";
            const preloadUrls = [
                `https://fanyi.baidu.com/gettts?lan=cte&spd=5&text=${encodeURIComponent(ttsText)}`,
                `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=zh-TW&q=${encodeURIComponent(ttsText)}`
            ];
            preloadUrls.forEach(url => {
                const a = new Audio();
                a.preload = 'auto';
                a.src = url;
                a.load();
            });
        }

        function playTTSAndStop() {
            isShuttingDown = true;
            statusString = 'SHUTTING DOWN';
            updateLcdTexture(true);
            clearTimeout(reconnectTimeout);

            const ttsText = "夠鐘罅，而家會幫你刪機。";

            if (isPageVisible && 'speechSynthesis' in window) {
                try {
                    const utterance = new SpeechSynthesisUtterance(ttsText);
                    utterance.lang = 'zh-HK';
                    utterance.rate = 1.2;
                    utterance.onend = () => stopRadio();
                    utterance.onerror = () => stopRadio();
                    speechSynthesis.speak(utterance);
                    if (hls) { hls.destroy(); hls = null; }
                    audio.pause();
                    setTimeout(() => { if (isShuttingDown) stopRadio(); }, 6000);
                    return;
                } catch (e) {}
            }

            const ttsUrls = [
                `https://fanyi.baidu.com/gettts?lan=cte&spd=5&text=${encodeURIComponent(ttsText)}`,
                `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=zh-TW&q=${encodeURIComponent(ttsText)}`
            ];
            let urlIndex = 0;

            function tryNextTTSUrl() {
                if (urlIndex >= ttsUrls.length) {
                    stopRadio();
                    return;
                }
                const currentUrl = ttsUrls[urlIndex++];
                if (hls) {
                    try { hls.detachMedia(); hls.destroy(); } catch(e) {}
                    hls = null;
                }
                audio.src = currentUrl;
                audio.loop = false;
                audio.playbackRate = 1.2;

                const onAudioEnded = () => {
                    audio.removeEventListener('ended', onAudioEnded);
                    audio.removeEventListener('error', onAudioError);
                    stopRadio();
                };
                const onAudioError = () => {
                    audio.removeEventListener('ended', onAudioEnded);
                    audio.removeEventListener('error', onAudioError);
                    tryNextTTSUrl();
                };

                audio.addEventListener('ended', onAudioEnded);
                audio.addEventListener('error', onAudioError);
                audio.play().catch(() => tryNextTTSUrl());
            }
            tryNextTTSUrl();
        }

        // --- 核心防休眠機制：直播流健康監測 ---
        function checkStreamHealth() {
            if (!isPlaying || isShuttingDown || isUserPaused || audio.paused) return;
            const now = Date.now();
            if (audio.currentTime !== lastAudioCurrentTime) {
                lastAudioCurrentTime = audio.currentTime;
                lastTimeProgressStamp = now;
            } else {
                // 背景逾時 10 秒未前進（代表緩衝區遇到斷流或凍結）
                if (now - lastTimeProgressStamp > 10000) {
                    lastTimeProgressStamp = now;
                    if (hls) {
                        try {
                            hls.recoverMediaError();
                            hls.startLoad();
                            if (hls.liveSyncPosition) audio.currentTime = hls.liveSyncPosition;
                        } catch(e) {
                            fallbackToSDStream();
                        }
                    } else {
                        audio.load();
                        audio.play().catch(() => {});
                    }
                }
            }
        }

        function triggerAutoResume() {
            if (!isPlaying || isShuttingDown || isUserPaused || !audio.paused) return;
            if (hls) {
                try {
                    hls.startLoad();
                    if (hls.liveSyncPosition && Math.abs(audio.currentTime - hls.liveSyncPosition) > 5) {
                        audio.currentTime = hls.liveSyncPosition;
                    }
                } catch(e) {}
            }
            audio.play().then(() => {
                statusString = (hls || audio.src.includes('m3u8')) ? 'LIVE [HQ]' : 'LIVE [SD]';
                updateLcdTexture(true);
                setLedBlink(false);
                lastTimeProgressStamp = Date.now();
                if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
            }).catch(() => {});
        }

        // --- 播放器控制 (原生/HLS 雙軌極限穩定) ---
        function playRadio() {
            clearTimeout(reconnectTimeout);
            isShuttingDown = false;
            isPlaying = true;
            isUserPaused = false;
            audio.playbackRate = 1.0;
            preloadTTS();

            // 啟動無聲保活錨點，向行動裝置作業系統註冊長效 AudioSession
            silenceAudio.play().catch(() => {});

            statusString = 'TUNING...';
            updateLcdTexture(true);
            setLedState(true);

            // iOS / Safari 優先原生播放（原生享有最高系統後台背景守護權限）
            if (isAppleDevice && audio.canPlayType('application/vnd.apple.mpegurl')) {
                if (hls) { hls.destroy(); hls = null; }
                audio.src = hqStreamUrl;
                audio.play().catch(handlePlayError);
            } else if (Hls.isSupported()) {
                if (hls) hls.destroy();
                hls = new Hls({ 
                    enableWorker: true, 
                    lowLatencyMode: false,
                    maxBufferLength: 60,
                    maxMaxBufferLength: 120,
                    backBufferLength: 30,
                    liveSyncDurationCount: 5,
                    liveMaxLatencyDurationCount: 12
                });
                hls.loadSource(hqStreamUrl);
                hls.attachMedia(audio);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    audio.play().catch(handlePlayError);
                });
                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                try { hls.startLoad(); } catch(e) { fallbackToSDStream(); }
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                try { hls.recoverMediaError(); } catch(e) { scheduleReconnect(); }
                                break;
                            default:
                                scheduleReconnect();
                                break;
                        }
                    }
                });
            } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
                audio.src = hqStreamUrl;
                audio.play().catch(handlePlayError);
            } else {
                fallbackToSDStream();
            }
        }

        function fallbackToSDStream() {
            if (hls) { hls.destroy(); hls = null; }
            audio.src = sdStreamUrl;
            audio.play().catch(handlePlayError);
        }

        function stopRadio() {
            clearTimeout(reconnectTimeout);
            isShuttingDown = false;
            isPlaying = false;
            isUserPaused = false;
            
            if (hls) { hls.destroy(); hls = null; }
            audio.pause();
            audio.removeAttribute('src');
            audio.load();
            audio.onended = null;
            audio.playbackRate = 1.0;
            silenceAudio.pause();

            statusString = 'RTHK 2 [OFF]';
            updateLcdTexture(true);
            setLedState(false);
            if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'none';
        }

        function scheduleReconnect() {
            if (!isPlaying || isShuttingDown || isUserPaused) return;
            statusString = 'RECONNECTING..';
            updateLcdTexture(true);
            setLedBlink(true);

            clearTimeout(reconnectTimeout);
            reconnectTimeout = setTimeout(() => {
                if (isPlaying && !isShuttingDown && !isUserPaused) {
                    if (hls) {
                        hls.loadSource(hqStreamUrl);
                        hls.startLoad();
                        audio.play().catch(() => {});
                    } else {
                        playRadio();
                    }
                }
            }, 3000);
        }

        function handlePlayError() {
            if (isPlaying && !isShuttingDown && !isUserPaused) scheduleReconnect();
        }

        audio.addEventListener('error', () => {
            if (isPlaying && !isShuttingDown && !isUserPaused) scheduleReconnect();
        });

        audio.addEventListener('playing', () => {
            if (isPlaying && !isShuttingDown) {
                isUserPaused = false;
                setLedBlink(false);
                statusString = (hls || audio.src.includes('m3u8')) ? 'LIVE [HQ]' : 'LIVE [SD]';
                updateLcdTexture(true);
                lastTimeProgressStamp = Date.now();
                if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
            }
        });

        // 監聽暫停：如果是由使用者手動暫停，嚴格禁止自動喚醒！
        audio.addEventListener('pause', () => {
            if (isPlaying && !isShuttingDown) {
                if (isUserPaused) {
                    statusString = 'PAUSED';
                    updateLcdTexture(true);
                    setLedBlink(true);
                    if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
                } else {
                    // 非人為暫停（例如短暫受電話打斷、網路抖動）
                    statusString = 'INTERRUPTED';
                    updateLcdTexture(true);
                    triggerAutoResume();
                }
            }
        });

        audio.addEventListener('waiting', () => {
            if (isPlaying && !isShuttingDown && !isUserPaused) {
                statusString = 'BUFFERING...';
                updateLcdTexture(true);
            }
        });

        // 3D LED 控制
        let ledBlinking = false;
        function setLedState(on) {
            ledBlinking = false;
            if (on) {
                ledMat.color.setHex(0xff2222);
                ledMat.emissive.setHex(0xff0000);
                ledPointLight.intensity = 1.6;
            } else {
                ledMat.color.setHex(0x330000);
                ledMat.emissive.setHex(0x000000);
                ledPointLight.intensity = 0;
            }
        }

        function setLedBlink(blink) {
            ledBlinking = blink;
        }

        // --- 核心突破：省電與背景狀態管理 ---
        document.addEventListener('visibilitychange', () => {
            isPageVisible = !document.hidden;
            if (isPageVisible) {
                clock.getDelta();
                updateLcdTexture(true);
                requestAnimationFrame(animate);
                
                if (isPlaying && !isShuttingDown && !isUserPaused && audio.paused) {
                    triggerAutoResume();
                }
            }
        });

        window.addEventListener('online', () => {
            if (isPlaying && !isShuttingDown && !isUserPaused) {
                triggerAutoResume();
            }
        });

        window.addEventListener('focus', () => {
            if (isPlaying && !isShuttingDown && !isUserPaused && audio.paused) triggerAutoResume();
        });

        window.addEventListener('pageshow', () => {
            if (isPlaying && !isShuttingDown && !isUserPaused && audio.paused) triggerAutoResume();
        });

        if ('audioSession' in navigator) {
            try {
                navigator.audioSession.type = 'playback';
            } catch (e) {}
        }

        // MediaSession 通知欄完整控制（徹底修復通知欄暫停自動恢復的 BUG）
        if ('mediaSession' in navigator) {
            try {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: 'RTHK Radio 2',
                    artist: '香港電台第二台',
                    album: '3D Retro Receiver'
                });

                // 通知欄點擊「播放」
                navigator.mediaSession.setActionHandler('play', () => {
                    isUserPaused = false;
                    if (!isPlaying) {
                        playRadio();
                    } else {
                        audio.play().catch(() => {});
                    }
                });

                // 通知欄點擊「暫停」
                navigator.mediaSession.setActionHandler('pause', () => {
                    isUserPaused = true;
                    audio.pause();
                });

                navigator.mediaSession.setActionHandler('stop', () => {
                    stopRadio();
                });
            } catch (e) {}
        }

        // --- 3D 渲染主迴圈 (帶可視性檢查，背景自動休眠) ---
        let clock = new THREE.Clock();
        function animate() {
            if (!isPageVisible) return;
            requestAnimationFrame(animate);

            let elapsedTime = clock.getElapsedTime();
            controls.update();
            updateKnobAnimation();

            if (ledBlinking) {
                let flash = Math.sin(elapsedTime * 10) > 0;
                ledMat.emissive.setHex(flash ? 0xff0000 : 0x000000);
                ledPointLight.intensity = flash ? 1.6 : 0;
            }

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
