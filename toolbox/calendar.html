<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <title>課業手帳</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    /* =================================================
       響應式日式手帳 UI 設計 (Hobonichi Style)
       ================================================= */
    :root {
      --bg-color: #f6f5f0; --grid-color: #e5e3dc;
      --text-main: #3a3a3a; --text-light: #8c8b87;
      --accent-color: #bfa498; --cal-border: #d4d1c9; --danger: #e07a5f;
    }
    body {
      margin: 0; padding: 0; background-color: var(--bg-color);
      background-image: linear-gradient(var(--grid-color) 1px, transparent 1px), linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
      background-size: 15px 15px; font-family: 'Noto Serif TC', 'PMingLiU', serif;
      color: var(--text-main); display: flex; flex-direction: column; align-items: center;
      min-height: 100vh; padding-bottom: 90px; box-sizing: border-box;
    }
    * { box-sizing: border-box; }

    /* 登入畫面 */
    #loginScreen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: var(--bg-color);
      background-image: linear-gradient(var(--grid-color) 1px, transparent 1px), linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
      background-size: 15px 15px; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center;
    }
    .login-box { background: rgba(255, 255, 255, 0.9); padding: 40px 30px; border-radius: 8px; border: 1px solid var(--accent-color); box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; }
    .login-box h2 { margin-top: 0; color: var(--text-main); font-weight: normal; letter-spacing: 2px; }
    .login-input { padding: 12px; font-size: 16px; width: 80%; border: 1px solid var(--cal-border); border-radius: 4px; text-align: center; letter-spacing: 4px; margin-bottom: 20px; background: #faf9f6; }
    .login-btn { padding: 12px 30px; font-size: 16px; background: var(--accent-color); color: white; border: none; border-radius: 4px; cursor: pointer; letter-spacing: 2px; }
    .login-error { color: var(--danger); font-size: 12px; margin-top: 10px; display: none; }

    /* 主畫面 UI */
    .header { margin: 25px 0 15px; text-align: center; }
    .header h1 { font-size: 22px; font-weight: normal; letter-spacing: 4px; margin: 0; }
    .planner-container { width: 98%; max-width: 700px; background: rgba(255, 255, 255, 0.85); border: 1px solid var(--accent-color); box-shadow: 2px 4px 12px rgba(0,0,0,0.04); padding: 10px; border-radius: 4px; }
    .month-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 16px; letter-spacing: 2px; padding: 0 10px; }
    .month-btn { background: none; border: none; color: var(--accent-color); cursor: pointer; font-size: 18px; padding: 10px; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: var(--cal-border); border: 1px solid var(--cal-border); }
    .weekday-header { background: #fbfaf8; text-align: center; font-size: 12px; padding: 6px 0; color: var(--text-light); }
    
    .day-cell { background: #ffffff; min-height: 100px; padding: 4px; display: flex; flex-direction: column; cursor: pointer; transition: background 0.2s; position: relative; }
    .day-cell:hover:not(.empty) { background: #fdfaf8; }
    .day-cell.saturday { background-color: #f2f6f7; }
    .day-cell.saturday:hover:not(.empty) { background-color: #ebf1f2; }
    .day-cell.sunday { background-color: #fdf5f5; }
    .day-cell.sunday:hover:not(.empty) { background-color: #faeded; }
    .day-cell.empty { background: #faf9f6 !important; cursor: default; }
    .day-cell.today .day-num { background: var(--accent-color); color: white; border-radius: 50%; width: 20px; height: 20px; line-height: 20px; text-align: center; }
    .day-num { font-size: 12px; margin-bottom: 5px; align-self: flex-start; }
    
    .task-item { display: flex; align-items: flex-start; gap: 4px; padding: 4px; margin-bottom: 4px; border-radius: 4px; border: 1px solid rgba(0,0,0,0.02); }
    .subject-tag { font-size: 9px; padding: 2px 4px; border-radius: 3px; background: rgba(255,255,255,0.7); font-weight: bold; white-space: nowrap; border: 1px solid rgba(0,0,0,0.04); line-height: 1.1; margin-top: 1px; }
    .task-desc { font-size: 11px; flex-grow: 1; line-height: 1.5; word-break: break-word; color: var(--text-main); overflow: hidden; white-space: pre-wrap; margin-bottom: 2px;}
    .more-tasks { font-size: 10px; color: var(--text-light); text-align: center; margin-top: 2px; letter-spacing: 1px; }

    #fileInput { display: none; }
    .camera-btn { position: fixed; bottom: 25px; width: 64px; height: 64px; background-color: var(--accent-color); border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 15px rgba(191, 164, 152, 0.5); cursor: pointer; z-index: 90; }
    .camera-btn:active { transform: scale(0.95); }
    .camera-btn svg { width: 28px; height: 28px; fill: white; }

    /* 彈窗設計 */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; flex-direction: column; justify-content: flex-end; z-index: 100; backdrop-filter: blur(2px); }
    .modal-content { background: #fdfdfc; width: 100%; height: 100%; max-height: 100%; border-radius: 0; padding: 20px; display: flex; flex-direction: column; animation: slideUp 0.3s ease-out; box-sizing: border-box; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-header { display: flex; justify-content: space-between; align-items: center; font-size: 18px; margin-bottom: 15px; color: var(--accent-color); border-bottom: 1px solid #eee; padding-bottom: 10px; }
    .btn-close-modal { background: none; border: none; font-size: 28px; line-height: 1; color: var(--text-light); cursor: pointer; padding: 0 5px; }
    .modal-body { overflow-y: auto; flex-grow: 1; padding-right: 5px; }
    
    .planner-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    .planner-table tr { cursor: pointer; transition: background 0.2s; }
    .planner-table tr:hover { background: #faf9f6; }
    .planner-table td { border: 1px solid var(--cal-border); padding: 12px 10px; font-size: 14px; line-height: 1.5; color: var(--text-main); }
    .td-subject { width: 25%; text-align: center; font-weight: bold; border-right: 1px dashed var(--cal-border) !important; }
    .td-task { text-align: left; white-space: pre-wrap; }
    .empty-msg { text-align: center; color: var(--text-light); padding: 40px 0; font-size: 14px; letter-spacing: 1px; }

    .edit-row { display: flex; gap: 6px; margin-bottom: 12px; align-items: flex-start; background: #fff; padding: 10px; border-radius: 6px; border: 1px solid var(--grid-color); }
    .edit-subject { width: 32%; padding: 10px 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; background: #faf9f6;}
    .edit-task { flex-grow: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; background: #faf9f6; }
    .btn-icon { background: none; border: none; color: var(--danger); font-size: 20px; padding: 8px 4px; cursor: pointer; line-height: 1; }
    .btn-add-row { width: 100%; padding: 14px; background: transparent; border: 1px dashed var(--accent-color); color: var(--accent-color); border-radius: 6px; cursor: pointer; font-size: 15px; margin-top: 10px; }
    
    .modal-footer { display: flex; justify-content: space-between; gap: 10px; margin-top: 20px; padding-bottom: 15px;}
    .btn { padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-family: inherit; }
    .btn-danger { background: #fdf5f5; color: var(--danger); border: 1px solid rgba(224, 122, 95, 0.3); flex: 1; }
    .btn-save { background: var(--accent-color); color: #fff; flex: 2; }

    #statusArea { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); font-size: 14px; background: rgba(58,58,58,0.9); color: white; padding: 10px 20px; border-radius: 20px; display: none; z-index: 200; white-space: nowrap;}
    @media (min-width: 600px) {
      .modal-overlay { justify-content: center; align-items: center; padding: 20px; }
      .modal-content { width: 90%; max-width: 500px; height: auto; max-height: 85vh; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    }
  </style>
</head>
<body>

  <!-- 密碼鎖屏 -->
  <div id="loginScreen">
    <div class="login-box">
      <h2>請輸入密碼</h2>
      <input type="password" id="pwdInput" class="login-input" placeholder="***" onkeypress="handleLoginKey(event)">
      <br>
      <button class="login-btn" onclick="checkPwd()">進入手帳</button>
      <div id="loginError" class="login-error">密碼錯誤，請重試</div>
    </div>
  </div>

  <div id="statusArea"></div>
  <div class="header"><h1>課業手帳</h1></div>

  <div class="planner-container">
    <div class="month-header">
      <button class="month-btn" onclick="changeMonth(-1)">〈</button>
      <span id="currentMonthText">載入中...</span>
      <button class="month-btn" onclick="changeMonth(1)">〉</button>
    </div>
    <div class="calendar-grid" id="calendarGrid">
      <div style="padding:20px; text-align:center; grid-column: span 7; font-size:12px;">讀取課業中...</div>
    </div>
  </div>

  <label class="camera-btn" for="fileInput">
    <svg viewBox="0 0 24 24"><path d="M4 4h3l2-2h6l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm8 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0-2a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/></svg>
  </label>
  <input type="file" id="fileInput" accept="image/*" capture="environment">

  <!-- 預覽視窗 -->
  <div id="viewModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <span id="viewModalDateTitle">日期</span>
        <button class="btn-close-modal" onclick="closeViewModal()">×</button>
      </div>
      <div class="modal-body">
        <table class="planner-table" id="viewTable"></table>
      </div>
     <button class="btn-add-row" onclick="checkAndOpenEditModal(editingDateStr)">＋ 進入編輯模式</button>
    </div>
  </div>

  <!-- 編輯視窗 -->
  <div id="dayModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <span id="modalDateTitle">編輯課業</span>
        <button class="btn-close-modal" onclick="closeEditModal()">×</button>
      </div>
      <div class="modal-body" id="modalTaskList"></div>
      <button class="btn-add-row" onclick="addEmptyRow()">＋ 手動新增一列</button>
      <div class="modal-footer">
        <button class="btn btn-danger" onclick="deleteAllTasks()">🗑️ 刪除當日全部</button>
        <button class="btn btn-save" onclick="saveModalChanges()">💾 儲存修改</button>
      </div>
    </div>
  </div>

  <!-- 科目清單 -->
  <datalist id="subjectList">
    <option value="中文"></option><option value="英文"></option>
    <option value="數學"></option><option value="公社"></option>
    <option value="生活教育"></option><option value="中史"></option>
    <option value="世史"></option><option value="科學"></option>
    <option value="化學"></option><option value="生物"></option>
    <option value="物理"></option><option value="地理"></option>
    <option value="視覺藝術"></option><option value="STREAM"></option>
    <option value="家政"></option><option value="體育"></option>
    <option value="電腦"></option><option value="普通話"></option>
    <option value="其他"></option>
  </datalist>

  <script>


// 產生或讀取本機的裝置 ID
let myDeviceId = localStorage.getItem('plannerDeviceId');
if (!myDeviceId) {
  myDeviceId = 'user_' + Math.random().toString(36).substring(2, 10);
  localStorage.setItem('plannerDeviceId', myDeviceId);
}

    
    const API_URL = "https://script.google.com/macros/s/AKfycbwIk4BlFeAD88ZIMJDyfdjZOWfxrVbNLimsR20yino2QNwQmVBveHV8QGns7l-vQKPI/exec";

    async function callApi(action, data = {}) {
      const payload = { action: action, ...data };
      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify(payload),
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          redirect: 'follow' 
        });
        return await response.json();
      } catch (error) {
        throw new Error("網路連線失敗");
      }
    }

    let currentDate = new Date();
    let currentEvents = [];
    let editingDateStr = '';
    let deletedEventIds = [];

    window.onload = () => {
      if (localStorage.getItem('plannerAuth') === '3CC_VERIFIED') {
        document.getElementById('loginScreen').style.display = 'none';
        loadCalendarData();
      }
    };

    function checkPwd() {
      if (document.getElementById('pwdInput').value === '3CC') {
        localStorage.setItem('plannerAuth', '3CC_VERIFIED');
        document.getElementById('loginScreen').style.display = 'none';
        loadCalendarData();
      } else {
        document.getElementById('loginError').style.display = 'block';
        document.getElementById('pwdInput').value = '';
      }
    }
    function handleLoginKey(e) { if (e.key === 'Enter') checkPwd(); }

    function showStatus(msg, autoHide = false) {
      const el = document.getElementById('statusArea');
      el.innerText = msg; el.style.display = 'block';
      if (autoHide) setTimeout(() => el.style.display = 'none', 4000);
    }

    function changeMonth(delta) {
      currentDate.setMonth(currentDate.getMonth() + delta);
      loadCalendarData();
    }

    function parseTaskTitle(title) {
      let subjVal = "", taskVal = title || "";
      if (title) {
        const match = title.match(/^\[(.*?)\]\s*([\s\S]*)$/);
        if (match) { subjVal = match[1]; taskVal = match[2]; }
      }
      return { subject: subjVal, task: taskVal };
    }

    function getFrontendSubjectColor(subject) {
      const upper = subject.toUpperCase();
      if (upper.includes('中文') || upper.includes('普通話') || upper.includes('PTH')) return { bg: '#ffe5e5', tagText: '#c97a7e' };
      if (upper.includes('英文') || upper.includes('ENG')) return { bg: '#e5f0ff', tagText: '#6a8caf' };
      if (upper.includes('數') || upper.includes('MATH')) return { bg: '#e5ffe8', tagText: '#72a079' };
      if (upper.includes('公社') || upper.includes('CES')) return { bg: '#f5e6ff', tagText: '#9973b0' };
      if (upper.includes('生活')) return { bg: '#fff4e5', tagText: '#b08c60' };
      if (upper.includes('史') || upper.includes('HIST')) return { bg: '#ffebd9', tagText: '#c28b5a' };
      if (upper.includes('地理') || upper.includes('GEOG')) return { bg: '#eef0db', tagText: '#878c52' };
      if (upper.includes('科學') || upper.includes('IS')) return { bg: '#f0e5ff', tagText: '#8d73b0' };
      if (upper.includes('化學') || upper.includes('CHEM')) return { bg: '#e5ffff', tagText: '#4eaeb0' };
      if (upper.includes('生物') || upper.includes('BIO')) return { bg: '#e5ffe8', tagText: '#59a35e' };
      if (upper.includes('物理') || upper.includes('PHY')) return { bg: '#e6e5ff', tagText: '#6866b8' };
      if (upper.includes('視藝') || upper.includes('VA') || upper.includes('視覺藝術')) return { bg: '#ffe5f7', tagText: '#c46aae' };
      if (upper.includes('STREAM')) return { bg: '#e5f8ff', tagText: '#5c98ad' };
      if (upper.includes('家政') || upper.includes('HE')) return { bg: '#ffe5eb', tagText: '#c2657d' };
      if (upper.includes('體育') || upper.includes('PE')) return { bg: '#ffebe5', tagText: '#b57059' };
      if (upper.includes('電腦') || upper.includes('COM') || upper.includes('CL')) return { bg: '#e8eaf6', tagText: '#656a8c' };
      return { bg: '#f0ebe4', tagText: '#8c8b87' };
    }

    async function loadCalendarData() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth() + 1;
      document.getElementById('currentMonthText').innerText = `${year} 年 ${month} 月`;
      
      try {
        const response = await callApi('getCalendarEvents', { year, month });
        if (response.success) {
          currentEvents = response.data;
          renderCalendar();
        } else {
          showStatus('讀取失敗: ' + response.error, true);
        }
      } catch (err) {
        showStatus('網路連線失敗', true);
      }
    }

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const todayStr = (new Date()).toISOString().split('T')[0];

      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';
      
      const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
      weekdays.forEach(day => {
        const div = document.createElement('div');
        div.className = 'weekday-header'; div.innerText = day;
        grid.appendChild(div);
      });

      for (let i = 0; i < firstDay; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'day-cell empty';
        grid.appendChild(emptyCell);
      }

      for (let i = 1; i <= daysInMonth; i++) {
        const dateStr = `${year}-${String(month+1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
        const cell = document.createElement('div');
        cell.className = 'day-cell';
        
        if (dateStr === todayStr) cell.classList.add('today');
        
        const dayOfWeek = new Date(year, month, i).getDay();
        if (dayOfWeek === 0) cell.classList.add('sunday');
        if (dayOfWeek === 6) cell.classList.add('saturday');
        
        cell.onclick = () => openViewModal(dateStr);

        const dayNum = document.createElement('div');
        dayNum.className = 'day-num'; dayNum.innerText = i;
        cell.appendChild(dayNum);

        const dayTasks = currentEvents.filter(e => e.date === dateStr);
        const MAX_VISIBLE = 2;

        dayTasks.forEach((t, index) => {
          if (index < MAX_VISIBLE) {
            const parsed = parseTaskTitle(t.title);
            const colors = getFrontendSubjectColor(parsed.subject);

            const taskDiv = document.createElement('div');
            taskDiv.className = 'task-item';
            taskDiv.style.backgroundColor = colors.bg;

            if (parsed.subject) {
              const tag = document.createElement('span');
              tag.className = 'subject-tag';
              tag.innerText = parsed.subject;
              tag.style.color = colors.tagText;
              taskDiv.appendChild(tag);
            }

            const desc = document.createElement('span');
            desc.className = 'task-desc';
            desc.innerText = parsed.task;
            taskDiv.appendChild(desc);

            cell.appendChild(taskDiv);
          } else if (index === MAX_VISIBLE) {
            const moreDiv = document.createElement('div');
            moreDiv.className = 'more-tasks';
            moreDiv.innerText = `+ ${dayTasks.length - MAX_VISIBLE} 更多`;
            cell.appendChild(moreDiv);
          }
        });
        grid.appendChild(cell);
      }
    }

    function openViewModal(dateStr) {
      editingDateStr = dateStr;
      document.getElementById('viewModalDateTitle').innerText = dateStr + " 課業清單";
      
      const tasks = currentEvents.filter(e => e.date === dateStr);
      const table = document.getElementById('viewTable');
      table.innerHTML = '';

      if (tasks.length === 0) {
        table.innerHTML = `<tr><td class="empty-msg" colspan="2">太棒了，今日無功課！☕</td></tr>`;
      } else {
        tasks.forEach(t => {
          const parsed = parseTaskTitle(t.title);
          const colors = getFrontendSubjectColor(parsed.subject);
          
          const tr = document.createElement('tr');
         tr.onclick = () => { checkAndOpenEditModal(dateStr); };

          const tdSubj = document.createElement('td');
          tdSubj.className = 'td-subject';
          tdSubj.style.backgroundColor = colors.bg;
          tdSubj.style.color = colors.tagText;
          tdSubj.innerText = parsed.subject || '其他';

          const tdTask = document.createElement('td');
          tdTask.className = 'td-task';
          tdTask.innerText = parsed.task;

          tr.appendChild(tdSubj); tr.appendChild(tdTask);
          table.appendChild(tr);
        });
      }
      document.getElementById('viewModal').style.display = 'flex';
    }

    function closeViewModal() { document.getElementById('viewModal').style.display = 'none'; }

    function openEditModal(dateStr) {
      closeViewModal();
      editingDateStr = dateStr;
      deletedEventIds = [];
      document.getElementById('modalDateTitle').innerText = dateStr + " 修訂模式";
      
      const tasks = currentEvents.filter(e => e.date === dateStr);
      const list = document.getElementById('modalTaskList');
      list.innerHTML = '';
      
      if (tasks.length === 0) addEmptyRow();
      else tasks.forEach(t => addRowToModal(t.id, t.title));
      
      document.getElementById('dayModal').style.display = 'flex';
    }

  function closeEditModal() { 
  document.getElementById('dayModal').style.display = 'none'; 
  // 背景發送釋放鎖的請求（不用等它回應）
  callApi('releaseLock', { dateStr: editingDateStr, userId: myDeviceId });
}

    function addRowToModal(id, title) {
      const list = document.getElementById('modalTaskList');
      const row = document.createElement('div');
      row.className = 'edit-row';
      const parsed = parseTaskTitle(title);

      const subjInput = document.createElement('input');
      subjInput.className = 'edit-subject';
      subjInput.setAttribute('list', 'subjectList');
      subjInput.placeholder = '科目';
      subjInput.value = parsed.subject;
      
      const taskInput = document.createElement('input');
      taskInput.className = 'edit-task';
      taskInput.type = 'text';
      taskInput.value = parsed.task;
      taskInput.placeholder = "課業內容...";
      
      const hiddenId = document.createElement('input');
      hiddenId.type = 'hidden'; hiddenId.className = 'edit-id'; hiddenId.value = id || '';

      const delBtn = document.createElement('button');
      delBtn.className = 'btn-icon'; delBtn.innerHTML = '✖';
      delBtn.onclick = () => { if (id) deletedEventIds.push(id); row.remove(); };
      
      row.appendChild(hiddenId); row.appendChild(subjInput); row.appendChild(taskInput); row.appendChild(delBtn);
      list.appendChild(row);
    }

    function addEmptyRow() { addRowToModal('', ''); }

    function deleteAllTasks() {
      if(confirm("確定要刪除當日「所有」課業紀錄嗎？\n此操作無法復原。")) {
        const rows = document.querySelectorAll('#modalTaskList .edit-row');
        rows.forEach(row => {
          const id = row.querySelector('.edit-id').value;
          if (id) deletedEventIds.push(id);
        });
        document.getElementById('modalTaskList').innerHTML = '';
        saveModalChanges();
      }
    }

    async function saveModalChanges() {
      const rows = document.querySelectorAll('#modalTaskList .edit-row');
      const changes = { toDelete: deletedEventIds, toUpdate: [], toAdd: [] };
      
      rows.forEach(row => {
        const id = row.querySelector('.edit-id').value;
        let subj = row.querySelector('.edit-subject').value.trim();
        let task = row.querySelector('.edit-task').value.trim();
        
        if (!task) return; 
        if (!subj) subj = "其他"; 
        
        const fullTitle = `[${subj}] ${task}`;
        
        if (id) {
          const original = currentEvents.find(e => e.id === id);
          if (original && original.title !== fullTitle) changes.toUpdate.push({ id: id, title: fullTitle });
        } else {
          changes.toAdd.push({ title: fullTitle });
        }
      });
      
      if (changes.toDelete.length === 0 && changes.toUpdate.length === 0 && changes.toAdd.length === 0) {
        closeEditModal(); return;
      }

      showStatus("儲存修改中...");
      closeEditModal();
      
      try {
      const res = await callApi('syncDayEvents', { dateStr: editingDateStr, changes: changes, userId: myDeviceId });
        if (res.success) { showStatus("儲存成功！", true); loadCalendarData(); } 
        else { showStatus("儲存失敗：" + res.error, true); }
      } catch(err) {
        showStatus("網路連線失敗", true);
      }
    }

    // =========================================================
    // 圖片壓縮與 AI 辨識 
    // =========================================================
    document.getElementById('fileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      showStatus('正在分析課業照片...');

      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = async function() {
          const canvas = document.createElement('canvas');
          let scaleSize = img.width > 800 ? 800 / img.width : 1;
          canvas.width = img.width * scaleSize; canvas.height = img.height * scaleSize;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          
          try {
            const res = await callApi('processHomeworkImage', { base64Image: canvas.toDataURL('image/jpeg', 0.8) });
            if (res.success) { 
              if (res.count && res.count > 0) {
                showStatus(`AI 辨識成功！已於今天加入 ${res.count} 項課業！`, true); 
              } else {
                showStatus('歸類成功，但圖片中未偵測到任何課業', true); 
              }
              // 強制重整以顯示最新資料
              loadCalendarData(); 
            } else { 
              showStatus('處理失敗：' + res.error, true); 
            }
          } catch(err) {
            showStatus('連線中斷', true);
          }
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });



async function checkAndOpenEditModal(dateStr) {
  showStatus("正在取得編輯權限...", false);
  try {
    const res = await callApi('requestLock', { dateStr: dateStr, userId: myDeviceId });
    if (res.success) {
      showStatus("已取得編輯權限", true);
      openEditModal(dateStr); // 成功拿到鎖，打開編輯視窗
    } else {
      showStatus("", true); // 清除提示
      alert("⚠️ 目前有其他同學正在編輯當日的課業！\n為避免資料覆蓋，請等候約 3 分鐘，或等對方儲存後再試。");
    }
  } catch (err) {
    showStatus("檢查權限失敗，請檢查網路", true);
  }
}


    
  </script>
